name: reproduce public credit research
on:
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-credit-repro.txt
      - run: python -m pytest -q
      - run: python scripts/run_all.py
      - uses: actions/upload-artifact@v4
        with:
          name: credit-research-aggregates
          path: |
            reports/credit/
            README.md
